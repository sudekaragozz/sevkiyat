server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # backend shares the db container's network namespace, so it is reachable as "db"
        proxy_pass http://db:8000;
        # settings.py has ALLOWED_HOSTS=[] with DEBUG=True, which only accepts localhost
        proxy_set_header Host localhost;
    }

    location / {
        try_files $uri /index.html;
    }
}
